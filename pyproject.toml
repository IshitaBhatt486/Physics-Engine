[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physics-engine"
version = "0.1.0"
description = "An interactive 2D ball-physics sandbox built with Pygame."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pygame>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
physics-engine = "physics_engine.app:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
